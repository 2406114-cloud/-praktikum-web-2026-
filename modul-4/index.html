
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Portfolio Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 12px #00000010;
        }

        h1 {
            margin-top: 0;
            color: #1e3a8a;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            padding: 18px;
            text-align: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }

        .stat-card p {
            margin: 0 0 10px;
            font-size: 12px;
            font-weight: bold;
            color: #64748b;
        }

        .stat-card h2 {
            margin: 0;
            font-size: 22px;
            color: #1e40af;
        }

        .form-section {
            margin-bottom: 26px;
            padding: 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }

        .form-section h3 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            margin-top: 14px;
            background: #1e40af;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .search-section {
            margin-bottom: 18px;
        }

        .search-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .project-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
            padding: 17px;
            border: 1px solid #dbe4f0;
            border-radius: 9px;
        }

        .project-info h4 {
            margin: 10px 0 7px;
        }

        .project-category {
            display: inline-block;
            padding: 5px 8px;
            border-radius: 5px;
            background: #e0f2fe;
            color: #0369a1;
            font-size: 12px;
        }

        .project-budget {
            margin: 0;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            padding: 6px 9px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
        }

        .badge-success {
            background: #dcfce7;
            color: #166534;
        }

        .badge-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .project-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 7px;
            margin-top: 10px;
        }

        .btn-status {
            background: #dbeafe;
            color: #1e40af;
        }

        .btn-delete {
            background: #fee2e2;
            color: #b91c1c;
        }

        .empty-message {
            padding: 20px;
            text-align: center;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .container {
                padding: 18px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .project-card {
                align-items: flex-start;
                flex-direction: column;
            }

            .project-actions {
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Interactive Portfolio Tracker</h1>
        <p class="subtitle">
            Kelola proyek, anggaran, dan status pekerjaanmu.
        </p>

        <div class="stats-grid">
            <div class="stat-card">
                <p>TOTAL PROYEK</p>
                <h2 id="stat-total-projects">0</h2>
            </div>

            <div class="stat-card">
                <p>TOTAL ANGGARAN</p>
                <h2 id="stat-total-budget">Rp0</h2>
            </div>

            <div class="stat-card">
                <p>PROYEK SELESAI</p>
                <h2 id="stat-completed-projects">0</h2>
            </div>
        </div>

        <section class="form-section">
            <h3>Tambah Proyek Baru</h3>

            <form id="project-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="project-title">Nama Proyek</label>
                        <input
                            type="text"
                            id="project-title"
                            placeholder="Masukkan nama proyek"
                            required
                            maxlength="100"
                        >
                    </div>

                    <div class="form-group">
                        <label for="project-category">Kategori</label>
                        <select id="project-category" required>
                            <option value="">Pilih kategori</option>
                            <option value="Web App">Web App</option>
                            <option value="Desktop App">Desktop App</option>
                            <option value="Mobile App">Mobile App</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="project-budget">Anggaran (Rp)</label>
                        <input
                            type="number"
                            id="project-budget"
                            placeholder="Contoh: 2500000"
                            min="1"
                            max="1000000000000"
                            step="1"
                            required
                        >
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    + Tambah Proyek
                </button>
            </form>
        </section>

        <div class="search-section">
            <label for="search-input">Cari Proyek</label>
            <input
                type="search"
                id="search-input"
                placeholder="Ketik nama proyek untuk mencari..."
            >
        </div>

        <h3>Daftar Proyek</h3>
        <div id="project-list"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
